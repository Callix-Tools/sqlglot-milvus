[project]
name = "sqlglot-milvus"
version = "0.1.0"
description = "MilvusQL: a SQL dialect for Milvus, as a sqlglot plugin"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Neko1313", email = "nikita.ribalchencko@yandex.ru" }
]
requires-python = ">=3.12"
keywords = ["sqlglot", "milvus", "sql", "dialect", "vector-search", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = ["sqlglot>=30.16.0,<31"]

[project.urls]
Homepage = "https://github.com/Callix-Tools/sqlglot-milvus"
Repository = "https://github.com/Callix-Tools/sqlglot-milvus"
Issues = "https://github.com/Callix-Tools/sqlglot-milvus/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"


[project.entry-points."sqlglot.dialects"]
milvus = "sqlglot_milvus.dialect:Milvus"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
lint = [
    "bandit~=1.8.6",
    "ruff~=0.16.2",
    "ty~=0.0.70",
]
test = [
    "greenlet>=3.5.5",
    "pytest~=8.4.2",
    "pytest-asyncio~=1.2.0",
    "pytest-cov~=7.1.0",
    "pytest-randomly~=4.0.1",
    "pytest-xdist[psutil]~=3.8.0",
]

# Tools settings

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
